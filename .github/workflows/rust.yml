name: Rust
on:
  push:
    branches:
     - "stable"
  pull_request:
    branches:
      - "stable"
      - "dev"

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: make build

  test:
    runs-on: ubuntu-latest
    needs:
      - build
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: make test
